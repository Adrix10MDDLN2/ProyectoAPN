# ==================================================
# PROYECTO TFG - PLATAFORMA DE STREAMING
# ==================================================

name: 'proyecto_apn'
version: '1.0.0'
config-version: 2

profile: 'default'

# Rutas del proyecto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Archivos generados por dbt
target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ==================================================
# CONFIGURACION DE MODELOS
# ==================================================

models:
  proyecto_apn:

    # STAGING: separacion y tipado inicial
    staging:
      +database: "{{ env_var('DBT_SILVER_DB_APN') }}"
      +schema: staging
      +materialized: view

    # SILVER: limpieza y normalizacion
    silver:
      +database: "{{ env_var('DBT_SILVER_DB_APN') }}"
      +schema: silver
      +materialized: table

    # GOLD: modelos analiticos
    gold:
      +database: "{{ env_var('DBT_GOLD_DB_APN') }}"
      +schema: gold
      +materialized: table
